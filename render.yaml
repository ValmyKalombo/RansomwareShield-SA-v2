services:
  - type: web
    name: ransomwareshield-sa
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    healthCheckPath: /login
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: SESSION_MINUTES
        value: 30
      - key: DATABASE_URL
        sync: false
