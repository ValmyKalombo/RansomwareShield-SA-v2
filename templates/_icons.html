{% macro icon(name, cls='ic') -%}
<svg class="{{ cls }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name=='dashboard' %}<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>
{%- elif name=='check' %}<path d="M4 12.5 9 17.5 20 6.5"/>
{%- elif name=='tasks' %}<path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1.5 1.5L7.5 5M3.5 12l1.5 1.5L7.5 11M3.5 18l1.5 1.5L7.5 17"/>
{%- elif name=='radar' %}<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12 18.4 5.6"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/>
{%- elif name=='shield' %}<path d="M12 3 20 6v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10V6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/>
{%- elif name=='users' %}<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c2 .6 3.3 2.4 3.6 5.2"/>
{%- elif name=='info' %}<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/>
{%- elif name=='logout' %}<path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4"/><path d="M10 16l-4-4 4-4M6 12h10"/>
{%- elif name=='plus' %}<path d="M12 5v14M5 12h14"/>
{%- elif name=='file' %}<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>
{%- elif name=='lock' %}<rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>
{%- elif name=='alert' %}<path d="M12 3 2.5 20h19z"/><path d="M12 10v4.5M12 17.5v.01"/>
{%- elif name=='x' %}<path d="M6 6l12 12M18 6 6 18"/>
{%- elif name=='key' %}<circle cx="8" cy="15" r="4"/><path d="M11 12 20 3M16 7l2.5 2.5M14 9l2 2"/>
{%- elif name=='trash' %}<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>
{%- elif name=='mail' %}<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 7 8.5-7"/>
{%- elif name=='compass' %}<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/>
{%- elif name=='activity' %}<path d="M3 12h4l3 7 4-14 3 7h4"/>
{%- elif name=='download' %}<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>
{%- elif name=='target' %}<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>
{%- endif %}</svg>
{%- endmacro %}

{% macro shieldai_logo(uid='a', cls='shieldai-logo') -%}
<svg class="{{ cls }}" viewBox="0 0 48 48" aria-hidden="true">
  <defs><linearGradient id="sg{{ uid }}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9b6bff"/><stop offset="1" stop-color="#31c8ff"/></linearGradient></defs>
  <path d="M24 3.5 40.5 9.5v12.8c0 10.6-7 19.2-16.5 22.2C14.5 41.5 7.5 32.9 7.5 22.3V9.5z" fill="#0b0828" stroke="url(#sg{{ uid }})" stroke-width="2.6"/>
  <path d="M24 15.5 16 29h16z" fill="none" stroke="#b9a4ff" stroke-width="1.4"/>
  <path d="M24 15.5V24M16 29l8-5 8 5" fill="none" stroke="#31c8ff" stroke-width="1.2" opacity=".8"/>
  <circle cx="24" cy="15.5" r="2.8" fill="#31c8ff"/><circle cx="16" cy="29" r="2.8" fill="#9b6bff"/><circle cx="32" cy="29" r="2.8" fill="#9b6bff"/>
  <circle cx="24" cy="24" r="2.2" fill="#fff"/>
</svg>
{%- endmacro %}
